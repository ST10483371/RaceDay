<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f2a1c"/>
      <stop offset="1" stop-color="#1b5a3a"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#sky)"/>
  <!-- Running track lanes: concentric ovals with a finish line -->
  <g fill="none" stroke-linecap="round">
    <ellipse cx="1150" cy="450" rx="620" ry="330" stroke="#ff6b1a" stroke-width="10" opacity="0.55"/>
    <ellipse cx="1150" cy="450" rx="560" ry="290" stroke="#ffffff" stroke-width="4" opacity="0.35"/>
    <ellipse cx="1150" cy="450" rx="500" ry="250" stroke="#ffffff" stroke-width="4" opacity="0.25"/>
    <ellipse cx="1150" cy="450" rx="440" ry="210" stroke="#ffffff" stroke-width="4" opacity="0.2"/>
    <ellipse cx="1150" cy="450" rx="380" ry="170" stroke="#ffffff" stroke-width="4" opacity="0.15"/>
  </g>
  <line x1="1530" y1="330" x2="1530" y2="570" stroke="#ffffff" stroke-width="6" opacity="0.5"/>
  <!-- Diagonal speed stripes -->
  <g stroke="#ff6b1a" stroke-width="14" opacity="0.18">
    <line x1="-100" y1="760" x2="420" y2="180"/>
    <line x1="-40" y1="860" x2="480" y2="280"/>
    <line x1="20" y1="940" x2="540" y2="360"/>
  </g>
  <!-- Vignette to keep the left side calm for text -->
  <rect width="1600" height="900" fill="#0a140f" opacity="0.25"/>
</svg>
